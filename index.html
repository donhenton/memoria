<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Atelier Memoria — Face</title>
<style>
  :root {
    --bg: #f4ede0;
    --paper: #faf6ed;
    --ink: #3d2817;
    --rule: #c9b896;
    --rule-light: #d4c5a5;
    --pin: #d4493a;
    --soft-ink: #5c4530;
    --ok: #7a8c5c;
    --warn: #a05a3c;
    --err: #9a4a4a;
    --info: #5c6b8a;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: Georgia, "Times New Roman", serif;
    min-height: 100vh;
    padding: 1.5rem 1rem 3rem;
  }
  .wrap { max-width: 540px; margin: 0 auto; }

  /* Header */
  h1 {
    font-size: 1.6rem;
    margin: 0;
    text-align: center;
    letter-spacing: 0.04em;
    font-weight: normal;
  }
  .subtitle {
    text-align: center;
    font-size: 0.7rem;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    opacity: 0.6;
    margin-top: 0.3rem;
    margin-bottom: 2rem;
  }

  /* Stats */
  .stats {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 0.5rem;
    margin-bottom: 1.5rem;
  }
  .stat {
    background: var(--paper);
    border: 1px solid var(--rule);
    padding: 0.9rem 0.5rem;
    text-align: center;
  }
  .stat-num { font-size: 1.5rem; font-weight: bold; line-height: 1; }
  .stat-label {
    font-size: 0.65rem;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    opacity: 0.6;
    margin-top: 0.4rem;
  }

  /* Buttons */
  .btn {
    display: block;
    width: 100%;
    padding: 1rem;
    background: var(--ink);
    color: var(--bg);
    border: none;
    font-family: inherit;
    font-size: 0.85rem;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    cursor: pointer;
    text-align: center;
  }
  .btn:disabled { background: var(--rule); cursor: default; }
  .btn-ghost {
    background: transparent;
    color: var(--ink);
    border: 1px solid var(--ink);
  }
  .btn-small {
    padding: 0.6rem;
    font-size: 0.75rem;
  }

  /* Card */
  .card {
    background: var(--paper);
    border: 1px solid var(--rule);
    padding: 1.25rem;
    box-shadow: 0 8px 24px rgba(61, 40, 23, 0.08);
    margin-bottom: 1rem;
  }
  .diagram-wrap {
    position: relative;
    background: #1a1a1a;
    margin-bottom: 1rem;
    overflow: hidden;
    aspectRatio: 800 / 1137;
  }
  .diagram-wrap img {
    width: 100%;
    display: block;
  }
  .pin {
    position: absolute;
    width: 28px;
    height: 28px;
    transform: translate(-50%, -50%);
    pointer-events: none;
  }
  .pin .ring {
    position: absolute;
    inset: 0;
    border-radius: 50%;
    background: var(--pin);
    opacity: 0.25;
    animation: pulse 1.6s ease-in-out infinite;
  }
  .pin .dot {
    position: absolute;
    inset: 8px;
    border-radius: 50%;
    background: var(--pin);
    border: 2px solid var(--bg);
  }
  @keyframes pulse {
    0%, 100% { transform: scale(1); opacity: 0.25; }
    50% { transform: scale(1.4); opacity: 0; }
  }

  .prompt {
    font-size: 1.1rem;
    text-align: center;
    line-height: 1.5;
    padding: 0.5rem 0;
    min-height: 3rem;
  }
  .prompt-label {
    font-size: 0.65rem;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    opacity: 0.55;
    text-align: center;
    margin-bottom: 0.6rem;
  }
  .answer { display: none; }
  .answer.show { display: block; }
  .rule { height: 1px; background: var(--rule-light); margin: 1rem 0; }
  .answer-name {
    font-size: 1.5rem;
    text-align: center;
    margin-bottom: 0.5rem;
  }
  .answer-where {
    font-size: 0.95rem;
    line-height: 1.6;
    color: var(--soft-ink);
    font-style: italic;
    text-align: center;
  }

  /* Rating buttons */
  .ratings {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 0.4rem;
    margin-top: 1rem;
  }
  .rating {
    padding: 0.85rem 0.3rem;
    color: var(--bg);
    border: none;
    cursor: pointer;
    font-family: inherit;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 0.15rem;
  }
  .rating .lbl { font-size: 0.85rem; }
  .rating .sub { font-size: 0.65rem; opacity: 0.85; }
  .r-forgot { background: var(--err); }
  .r-hard   { background: var(--warn); }
  .r-good   { background: var(--ok); }
  .r-easy   { background: var(--info); }

  /* Progress */
  .progress {
    height: 2px;
    background: var(--rule-light);
    margin-bottom: 1.5rem;
    position: relative;
  }
  .progress-bar {
    position: absolute;
    left: 0; top: 0;
    height: 100%;
    background: var(--ink);
    transition: width 0.3s;
  }
  .session-info {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 1rem;
    font-size: 0.8rem;
  }
  .link-btn {
    background: none;
    border: none;
    color: var(--ink);
    cursor: pointer;
    font-family: inherit;
    text-decoration: underline;
    font-size: 0.85rem;
  }
  .counter {
    letter-spacing: 0.15em;
    text-transform: uppercase;
    opacity: 0.7;
  }

  /* Card list */
  .deck-list { margin-top: 1.5rem; }
  .deck-row {
    background: var(--paper);
    border: 1px solid var(--rule-light);
    padding: 0.7rem 0.9rem;
    margin-bottom: 0.4rem;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 0.5rem;
    font-size: 0.85rem;
  }
  .deck-row .meta {
    font-size: 0.7rem;
    opacity: 0.55;
  }

  .footer-note {
    text-align: center;
    font-size: 0.7rem;
    opacity: 0.5;
    margin-top: 2rem;
    line-height: 1.6;
  }

  .danger {
    color: var(--err);
    border-color: var(--err);
  }

  .empty-state {
    text-align: center;
    padding: 2rem 1rem;
    background: var(--paper);
    border: 1px dashed var(--rule);
    margin-bottom: 1rem;
  }
  .empty-state h3 {
    margin: 0 0 0.5rem;
    font-weight: normal;
    letter-spacing: 0.05em;
  }
  .empty-state p {
    margin: 0;
    font-size: 0.85rem;
    opacity: 0.7;
    line-height: 1.5;
  }
</style>
</head>

const STORAGE_KEY = "atelier_memoria_v1";
const DAY = 24 * 60 * 60 * 1000;

// ========== STATE ==========
let state = loadState();

function loadState() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) return JSON.parse(raw);
  } catch (e) {}
  return freshState();
}

function freshState() {
  return {
    cards: DECK_SEED.map(c => ({
      ...c,
      reps: 0,
      ease: 2.5,
      interval: 0,
      next: Date.now(),
      lastReviewed: null,
    })),
    streak: 0,
    lastStudyDate: null,
    session: null,
  };
}

function save() {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch (e) {}
}

// ========== SM-2 ==========
function schedule(card, quality) {
  let { reps, ease, interval } = card;
  if (quality < 3) {
    reps = 0;
    interval = 1;
  } else {
    if (reps === 0) interval = 1;
    else if (reps === 1) interval = 6;
    else interval = Math.round(interval * ease);
    reps += 1;
  }
  ease = Math.max(1.3, ease + (0.1 - (5 - quality) * (0.08 + (5 - quality) * 0.02)));
  return {
    reps,
    ease,
    interval,
    next: Date.now() + interval * DAY,
    lastReviewed: Date.now(),
  };
}

function fmtNext(ts) {
  const ms = ts - Date.now();
  if (ms <= 0) return "now";
  const hours = ms / (60 * 60 * 1000);
  if (hours < 24) return Math.ceil(hours) + "h";
  const days = Math.round(hours / 24);
  if (days === 1) return "1d";
  if (days < 30) return days + "d";
  return Math.round(days / 30) + "mo";
}

// ========== ROUTING ==========
let view = "home";
function render() {
  const app = document.getElementById("app");
  app.innerHTML = "";
  if (view === "home") renderHome(app);
  else if (view === "study") renderStudy(app);
  else if (view === "manage") renderManage(app);
  window.scrollTo(0, 0);
}

      Cards alternate between pin → name and name → pin.<br>
      SM-2 algorithm. Saved in your browser.<br>
      Add to home screen for app-like access.
    </div>
  `;

  document.getElementById("start-btn").onclick = startSession;
  document.getElementById("manage-btn").onclick = () => { view = "manage"; render(); };
}

// ========== STUDY ==========
function startSession() {
  const due = state.cards.filter(c => c.next <= Date.now());
  if (due.length === 0) return;
  // Shuffle
  const queue = due.slice().sort(() => Math.random() - 0.5);
  // Assign direction per card
  state.session = {
    queue: queue.map((c, i) => ({
      cardId: c.id,
      direction: i % 2 === 0 ? "pin2name" : "name2pin",
    })),
    idx: 0,
    showAnswer: false,
    reviewed: 0,
  };
  view = "study";
  render();
}

function renderStudy(root) {
  const s = state.session;
  if (!s || s.idx >= s.queue.length) {
    state.session = null;
    save();
    view = "home";
    render();
    return;
  }
  const item = s.queue[s.idx];
  const card = state.cards.find(c => c.id === item.cardId);
  const isPin2Name = item.direction === "pin2name";

  root.innerHTML = `
    <div class="session-info">
      <button class="link-btn" id="exit-btn">← exit</button>
      <span class="counter">${s.idx + 1} / ${s.queue.length}</span>
    </div>
    <div class="progress"><div class="progress-bar" style="width:${(s.idx / s.queue.length) * 100}%"></div></div>

    <div class="card">
      <div class="prompt-label">
        ${isPin2Name ? "What is this feature?" : "Where on the face?"}
      </div>

      <div class="diagram-wrap" id="diagram">
        <img src="${DIAGRAM_SRC}" alt="Face diagram">
        ${isPin2Name ? `
          <div class="pin" style="left:${card.x}%; top:${card.y}%;">
            <div class="ring"></div>
            <div class="dot"></div>
          </div>
        ` : ""}
        <div id="answer-pin"></div>
      </div>

      ${!isPin2Name ? `
        <div class="prompt"><strong>${card.name}</strong></div>
      ` : ""}

      <div class="answer ${s.showAnswer ? "show" : ""}">
        <div class="rule"></div>
        ${isPin2Name ? `
          <div class="answer-name">${card.name}</div>
          <div class="answer-where">${card.where}</div>
        ` : `
          <div class="answer-where">${card.where}</div>
        `}
      </div>
    </div>

    ${!s.showAnswer ? `
      <button id="reveal-btn" class="btn">Reveal Answer</button>
    ` : `
      <div class="ratings">
        <button class="rating r-forgot" data-q="0"><span class="lbl">Forgot</span><span class="sub">&lt;1d</span></button>
        <button class="rating r-hard"   data-q="3"><span class="lbl">Hard</span><span class="sub">${fmtNextPreview(card, 3)}</span></button>
        <button class="rating r-good"   data-q="4"><span class="lbl">Good</span><span class="sub">${fmtNextPreview(card, 4)}</span></button>
        <button class="rating r-easy"   data-q="5"><span class="lbl">Easy</span><span class="sub">${fmtNextPreview(card, 5)}</span></button>
      </div>
    `}
  `;

  document.getElementById("exit-btn").onclick = () => {
    state.session = null; save(); view = "home"; render();
  };

  if (!s.showAnswer) {
    document.getElementById("reveal-btn").onclick = () => {
      s.showAnswer = true;
      // For name2pin, also reveal the pin on the diagram
      if (!isPin2Name) {
        const pinEl = document.getElementById("answer-pin");
        pinEl.innerHTML = `
          <div class="pin" style="left:${card.x}%; top:${card.y}%;">
            <div class="ring"></div>
            <div class="dot"></div>
          </div>
        `;
        // Re-render the answer block too
        document.querySelector(".answer").classList.add("show");
        // Replace the reveal button with ratings
        document.getElementById("reveal-btn").outerHTML = `
          <div class="ratings">
            <button class="rating r-forgot" data-q="0"><span class="lbl">Forgot</span><span class="sub">&lt;1d</span></button>
            <button class="rating r-hard"   data-q="3"><span class="lbl">Hard</span><span class="sub">${fmtNextPreview(card, 3)}</span></button>
            <button class="rating r-good"   data-q="4"><span class="lbl">Good</span><span class="sub">${fmtNextPreview(card, 4)}</span></button>
            <button class="rating r-easy"   data-q="5"><span class="lbl">Easy</span><span class="sub">${fmtNextPreview(card, 5)}</span></button>
          </div>
        `;
        attachRatingHandlers();
      } else {
        render();
      }
    };
  } else {
    attachRatingHandlers();
  }
}

function attachRatingHandlers() {
  document.querySelectorAll(".rating").forEach(btn => {
    btn.onclick = () => handleRating(parseInt(btn.dataset.q));
  });
}

function fmtNextPreview(card, q) {
  const next = schedule(card, q);
  return fmtNext(next.next);
}

function handleRating(quality) {
  const s = state.session;
  const item = s.queue[s.idx];
  const card = state.cards.find(c => c.id === item.cardId);
  const updated = { ...card, ...schedule(card, quality) };
  state.cards = state.cards.map(c => c.id === card.id ? updated : c);

  // Streak
  const today = new Date().toDateString();
  if (state.lastStudyDate !== today) {
    const yesterday = new Date(Date.now() - DAY).toDateString();
    state.streak = state.lastStudyDate === yesterday ? state.streak + 1 : 1;
    state.lastStudyDate = today;
  }

  s.idx += 1;
  s.showAnswer = false;
  s.reviewed += 1;
  save();
  render();
}

// ========== MANAGE ==========
function renderManage(root) {
  root.innerHTML = `
    <div class="session-info">
      <button class="link-btn" id="back-btn">← back</button>
      <span class="counter">Manage</span>
      <span style="width:50px;"></span>
    </div>

    <div class="deck-list" id="deck-list"></div>

    <button id="reset-btn" class="btn btn-ghost btn-small danger" style="margin-top:1.5rem;">
      Reset all progress
    </button>
  `;
  document.getElementById("back-btn").onclick = () => { view = "home"; render(); };
  document.getElementById("reset-btn").onclick = () => {
    if (confirm("Reset all progress? Restores fresh deck and clears streak.")) {
      state = freshState();
      save();
      render();
    }
  };

  const list = document.getElementById("deck-list");
  state.cards
    .slice()
    .sort((a, b) => a.id - b.id)
    .forEach(c => {
      const row = document.createElement("div");
      row.className = "deck-row";
      row.innerHTML = `
        <div>
          <div>#${c.id} ${c.name}</div>
          <div class="meta">reps ${c.reps} · next ${fmtNext(c.next)}</div>
        </div>
      `;
      list.appendChild(row);
    });
}

// ========== KICK OFF ==========
render();
</script>
</body>
</html>
